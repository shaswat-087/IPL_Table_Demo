<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Score Card Demo </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" type="text/css" href="score.css">
</head>
<body>
    <header>
       <div class="tata-ipl">
        <img src="image/logo.png" >

      </div>
      <div class="jiohotstar">
      <h1> JioHotstar </h1>
      <p> 10.9Cr views</p>
      </div>
     
    </header>

<footer>
<div class="scorecard">
    <div class="team1-logo">
            <img src="https://static.wixstatic.com/media/0293d4_4f6b270c74954974b3ff95cb7fa42beb~mv2.jpg/v1/fill/w_980,h_552,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/0293d4_4f6b270c74954974b3ff95cb7fa42beb~mv2.jpg">
    </div>
    <div class="team1">
        <div class="row1">
        <div class="team1-name">
         <p> CSK </p>
         </div>
         <div class="team1-score">
            <p> 93-2</p>
         </div>
         <div class="overs">
            7.5
         </div>
        </div>
        <div class="row2">
            <div class="team2-name">
         <p> v RCB </p>
         </div>
         <div class="venue">
            <p> CHENNAI </p>
         </div>
    
            
        </div>
      
    </div>
     <div class="team1-bat">
        <div class="bat1">
            RUTURAJ 
        </div>
        <div class="bat2">
            DHONI
        
        </div>
     </div>
        <div class="runs">
         <span >35</span>
                  
         <span>50</span>
                   
         </div>

        <div class="balls">
             <span>19</span>
             <span>31</span>
        </div>

    <div class="run-rate">
        <span class="text"> RUN-RATE </span>
        <span class="value"> 11.87</span>
    </div>

    <div class="team2">
        <div class="bowler-block">
        <span class="bowler">BHUVANESHWAR </span>
        <div class="over-boxes">
        <div class="ball">1</div>
        <div class="ball">🌳 </div>
        <div class="ball">4</div>
        <div class="ball">🌳 </div>
        <div class="ball">2</div>
        <div class="ball"> </div>
        </div>
      </div>
     
      <div class="spell">
        <span class="figure">
            0-31
        </span>
        <span class="bowled">
            2.5
        </span>
      </div>
     
    </div>
    <div class="team2-logo">
        <img src="https://d16f573ilcot6q.cloudfront.net/wp-content/uploads/2024/02/RCB.webp">
    </div>

  
</div>
</footer>
